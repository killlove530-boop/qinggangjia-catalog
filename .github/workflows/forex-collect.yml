name: 外匯資料每日收集

on:
  schedule:
    - cron: "17 1 * * *"   # 每天 UTC 01:17（台灣時間 09:17）
  workflow_dispatch:
    inputs:
      days:
        description: "回補天數"
        default: "365"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 下載匯率
        run: python3 forex/collect.py --days "${{ github.event.inputs.days || '365' }}"
      - name: 提交資料
        run: |
          git config user.name "forex-bot"
          git config user.email "forex-bot@users.noreply.github.com"
          git add forex/data
          git diff --cached --quiet || git commit -m "外匯資料更新 $(date -u +%F)"
          git push
